[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-occupancy-monitor"
version = "0.1.0"
description = "Classical image-processing parking occupancy project"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3", "opencv-python>=4.10,<5", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
parking-monitor = "parking_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
